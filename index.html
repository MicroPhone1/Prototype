<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kittiphit Boonying — Portfolio</title>
<style>html,body{margin:0;min-height:100%;background:#04070e;color:#dff6ff;font-family:system-ui,sans-serif}.boot{min-height:100vh;display:grid;place-items:center;text-align:center}.boot b{color:#35d6f5}.boot small{display:block;margin-top:10px;color:#7f9dae}</style>
</head>
<body><div class="boot"><div><b>KB//PORTFOLIO</b><small>Loading portfolio…</small></div></div>
<script>
(async()=>{try{const count=19;let b64="";for(let i=0;i<count;i++){const n=String(i).padStart(2,"0");const r=await fetch(`parts/p${n}.txt`);if(!r.ok)throw new Error(`Missing part ${n}`);b64+=await r.text()}const raw=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));if(!("DecompressionStream" in window))throw new Error("Browser does not support DecompressionStream");const stream=new Blob([raw]).stream().pipeThrough(new DecompressionStream("gzip"));const html=await new Response(stream).text();document.open();document.write(html);document.close()}catch(e){document.body.innerHTML=`<div class="boot"><div><b>Portfolio load error</b><small>${String(e.message||e)}</small></div></div>`}})();
</script></body></html>
